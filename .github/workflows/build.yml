name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testReleaseUnitTest --no-daemon 2>&1 | tee build.log
      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee -a build.log
          cp app/build/outputs/apk/release/app-release.apk PhoneAssistant.apk
      # Surface compiler/test errors as annotations, readable without downloading logs.
      - name: Report errors
        if: failure()
        run: |
          {
            grep -E "CMake Error|CMake Warning \(dev\)" -A14 build.log || true
            grep -E "^e: |error:|FAILED|What went wrong|Misunderstood" -A4 build.log | grep -v "Detecting\|compiler identification\|Check for working" || true
            find app/.cxx -name "CMakeError.log" -o -name "CMakeConfigureLog.yaml" 2>/dev/null | head -1 | xargs -r tail -40
          } | grep -v "^--$" | head -150 > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::${msg}"

      # The AI engine and the wake-word engine are native code: make sure both made it into the APK.
      - name: Check native libraries
        run: |
          libs=$(unzip -l PhoneAssistant.apk | grep -o 'lib/arm64-v8a/[^ ]*\.so' | sort | tr '\n' ' ')
          echo "::notice title=Native libraries::$libs"
          for lib in libllama_jni.so libvosk.so libjnidispatch.so; do
            echo "$libs" | grep -q "$lib" || { echo "::error title=Missing native library::$lib"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneAssistant-apk
          path: PhoneAssistant.apk
      # Pushes to main are published as the latest release; the app's updater installs it.
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Phone Assistant build ${{ github.run_number }}
          make_latest: true
          files: PhoneAssistant.apk
          body: ${{ github.event.head_commit.message }}
